services:
  - type: web
    name: dekel-ai-studio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run check && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dekel-ai-accounts
          property: connectionString

databases:
  - name: dekel-ai-accounts
    plan: free
    databaseName: dekel_ai
    user: dekel_ai
    ipAllowList: []
